        </button>

        <button onclick="runAlgorithm('DFS')">
            DFS
        </button>

        <button onclick="runAlgorithm('Hill Climbing')">
            Hill Climbing
        </button>

        <button onclick="runAlgorithm('AO*')">
            AO*
        </button>

    </div>


    <div id="result">

        Select two cities to calculate distance.

    </div>

</div>


<script>

const distances = {

    "Visakhapatnam-Vijayawada": 350,
    "Visakhapatnam-Guntur": 400,
    "Visakhapatnam-Tirupati": 760,
    "Visakhapatnam-Nellore": 670,
    "Visakhapatnam-Kurnool": 650,
    "Visakhapatnam-Kadapa": 650,
    "Visakhapatnam-Rajahmundry": 190,

    "Vijayawada-Guntur": 35,
    "Vijayawada-Tirupati": 410,
    "Vijayawada-Nellore": 280,
    "Vijayawada-Kurnool": 350,
    "Vijayawada-Kadapa": 430,
    "Vijayawada-Rajahmundry": 160,

    "Guntur-Tirupati": 390,
    "Guntur-Nellore": 260,
    "Guntur-Kurnool": 330,
    "Guntur-Kadapa": 410,
    "Guntur-Rajahmundry": 190,

    "Tirupati-Nellore": 130,
    "Tirupati-Kurnool": 360,
    "Tirupati-Kadapa": 220,
    "Tirupati-Rajahmundry": 500,

    "Nellore-Kurnool": 390,
    "Nellore-Kadapa": 290,
    "Nellore-Rajahmundry": 410,

    "Kurnool-Kadapa": 210,
    "Kurnool-Rajahmundry": 500,

    "Kadapa-Rajahmundry": 430
};


function getDistance(city1, city2) {

    if (city1 === city2) {
        return 0;
    }

    let key1 = city1 + "-" + city2;

    let key2 = city2 + "-" + city1;

    if (distances[key1]) {
        return distances[key1];
    }

    if (distances[key2]) {
        return distances[key2];
    }

    return "Distance not available";
}


function calculateDistance() {

    let city1 =
        document.getElementById("city1").value;

    let city2 =
        document.getElementById("city2").value;

    let distance =
        getDistance(city1, city2);

    document.getElementById("result").innerHTML =

        "<h3>Distance Result</h3>" +

        "<p><b>From:</b> " +
        city1 +
        "</p>" +

        "<p><b>To:</b> " +
        city2 +
        "</p>" +

        "<p><b>Distance:</b> " +
        distance +
        " km</p>";
}


function runAlgorithm(algorithm) {

    let city1 =
        document.getElementById("city1").value;

    let city2 =
        document.getElementById("city2").value;

    let distance =
        getDistance(city1, city2);

    document.getElementById("result").innerHTML =

        "<h3>" +
        algorithm +
        " Algorithm Selected" +
        "</h3>" +

        "<p><b>Start City:</b> " +
        city1 +
        "</p>" +

        "<p><b>Destination:</b> " +
        city2 +
        "</p>" +

        "<p><b>Distance:</b> " +
        distance +
        " km</p>" +

        "<p>Algorithm ready for route optimization.</p>";
}

</script>

</body>
